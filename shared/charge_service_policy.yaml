    - '退款'
    - '优惠券'
    - '发票'
    - '登录'
    - '注册'
    - '白名单'
    - '结算'
    - '故障'
    - '报错'
    - 'billing'
    - 'order'
    - 'charger'
    - 'station'
    - 'payment'
    - 'refund'
    - 'invoice'
    - 'login'
  prompts:
    zh:
      - '请补充具体对象和问题。例如：计费模板入口在哪、订单支付失败、设备白名单如何添加。'
      - '仍缺少关键对象。请按“功能或页面 + 想做什么 + 当前结果或报错”描述；如果是故障，也可以直接上传截图。'
    en:
      - 'Please name the feature and the exact issue, for example: billing template location, order payment failure, or adding a device allowlist entry.'
      - 'The key object is still missing. Describe the feature or page, the intended action, and the current result or error. You can also upload a screenshot for a fault.'
  exhausted_reply:
    zh: '连续两次仍无法确认具体问题，本轮不再重复追问。请重新发送一条完整描述：“功能或页面 + 操作 + 当前结果或报错”；故障场景可附截图。'
    en: 'The issue is still unclear after two prompts, so I will not repeat the same question. Send one complete description: feature or page + action + current result or error. Attach a screenshot for a fault if available.'

