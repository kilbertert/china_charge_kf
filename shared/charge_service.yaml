security:
  refuse_patterns:
    - '(?i)(?:绕过权限|越权|提权|bypass.{0,20}(?:permission|authorization)|privilege.{0,10}escalat)'
    - '(?i)(?:导出|显示|查看|告诉|获取|泄露|export|show|reveal|dump|get).{0,24}(?:管理员密码|密码|token|api[ _-]?key|secret|credential|凭据|密钥)'
    - '(?i)(?:删除|清空|擦除|销毁|drop|delete|wipe|purge).{0,24}(?:所有|全部|全量|数据库|用户数据|用户账号|all|database|user data|accounts)'
  reply:
    zh: '我不能执行或指导绕过权限、批量删除数据，也不能提供或导出管理员密码、Token、密钥等凭据。请通过正式管理后台和审批流程，由有权限的人员操作；如果你是在处理故障或申请权限，请提供项目、账号角色和页面报错，我可以协助定位。'
    en: 'I cannot execute or guide permission bypasses or bulk data deletion, and I cannot reveal or export administrator passwords, tokens, API keys, or other credentials. Use the approved administration and authorization process. For troubleshooting or an access request, provide the project, account role, and the exact page error.'

