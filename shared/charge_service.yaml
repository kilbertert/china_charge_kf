    replies:
      location_zh: '普通计费模板入口：充电桩 > 计费模板管理。节日计费模板入口：充电桩 > 场地设置。'
      holiday_location_zh: '节日计费模板入口：充电桩 > 场地设置。普通计费模板则在：充电桩 > 计费模板管理。'
      setup_zh: '普通计费模板请先进入：充电桩 > 计费模板管理；节日计费模板请进入：充电桩 > 场地设置。当前已核实的业务资料只确认这两个入口，尚未固化具体字段和生效前置条件，我不会把占位样例当成生产规则。请说明你要配置普通模板还是节日模板，并提供当前页面或版本，我再按真实界面继续。'
      location_en: 'Standard billing templates are under Charging Pile > Billing Template Management. Holiday billing templates are under Charging Pile > Site Settings.'
      holiday_location_en: 'Holiday billing templates are under Charging Pile > Site Settings. Standard billing templates are under Charging Pile > Billing Template Management.'
      setup_en: 'Open Charging Pile > Billing Template Management for a standard template, or Charging Pile > Site Settings for a holiday template. These are the only verified paths in the current business materials; exact fields and activation prerequisites are not yet established as production rules. Specify the template type and provide the current page or product version for exact steps.'
    evidence:
      - 'Workflow-China_charge_seriver-draft-9380/32-6.17（充电桩知识库）/06-architecture-framework.md'
    excluded_unverified_claims:
